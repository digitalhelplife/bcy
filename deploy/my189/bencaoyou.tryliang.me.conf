# Native deployment of 本草小游记·成都篇 on my189.
# Static game + Nakama module (Docker on 127.0.0.1:7350/7351). S0 device-trial mode: /auth/* is 404.
server {
    listen 80;
    server_name bencaoyou.tryliang.me;

    location ^~ /.well-known/acme-challenge/ {
        root /www/server/panel/vhost/acme;
        default_type text/plain;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl;
    http2 on;
    server_name bencaoyou.tryliang.me;

    ssl_certificate     /etc/letsencrypt/live/bencaoyou.tryliang.me/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/bencaoyou.tryliang.me/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers HIGH:!aNULL:!MD5;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 1d;
    server_tokens off;

    root /home/youdt/bencaoyou-web;
    index index.html;
    client_max_body_size 1m;
    gzip on;
    gzip_types application/javascript text/javascript text/css application/json image/svg+xml;
    gzip_min_length 1024;

    add_header Strict-Transport-Security "max-age=31536000" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "geolocation=(), camera=(), microphone=()" always;
    add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; font-src 'self'; connect-src 'self' wss://bencaoyou.tryliang.me; media-src 'self' blob:; worker-src 'self'; frame-ancestors 'none'; base-uri 'none'; form-action 'self'" always;

    # S0 device trial: the frontend treats a 404 on /auth/config as device mode.
    location ^~ /auth/ { return 404; }
    location ^~ /internal/ { return 404; }
    location ^~ /admin/ { return 404; }
    location ^~ /demo/ { return 404; }

    location = /healthcheck {
        proxy_pass http://127.0.0.1:7350;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
    }

    location = /ws {
        proxy_pass http://127.0.0.1:7350;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
        proxy_buffering off;
    }

    location ^~ /v2/console/ {
        proxy_pass http://127.0.0.1:7351;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 120s;
    }

    location = /console { return 301 /console/; }
    location ^~ /console/ {
        proxy_pass http://127.0.0.1:7351;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 120s;
    }

    location ^~ /static/ {
        proxy_pass http://127.0.0.1:7351;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
    }

    location ^~ /v2/ {
        proxy_pass http://127.0.0.1:7350;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
    }

    location = /sw.js {
        expires -1;
        try_files $uri =404;
    }
    location = /index.html {
        expires -1;
    }
    location = / {
        expires -1;
        try_files /index.html =404;
    }
    location ^~ /assets/ {
        expires 30d;
        try_files $uri =404;
    }
    location ^~ /fonts/ {
        expires 30d;
        try_files $uri =404;
    }
    location ^~ /share/ {
        expires 7d;
        try_files $uri =404;
    }
    location / {
        try_files $uri /index.html;
    }
}
