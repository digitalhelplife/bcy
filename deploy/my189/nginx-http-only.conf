# Temporary HTTP vhost used only to obtain the Let's Encrypt certificate.
server {
    listen 80;
    server_name bencaoyou.tryliang.me;

    location ^~ /.well-known/acme-challenge/ {
        root /www/server/panel/vhost/acme;
        default_type text/plain;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}
