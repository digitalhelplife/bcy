map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

server {
    listen 80;
    listen [::]:80;
    server_name ex-game.tryliang.me;

    location /.well-known/acme-challenge/ {
        root /var/www/html;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name ex-game.tryliang.me;

    ssl_certificate /etc/letsencrypt/live/ex-game.tryliang.me/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/ex-game.tryliang.me/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    access_log /var/log/nginx/ex-game.access.log;
    error_log  /var/log/nginx/ex-game.error.log warn;

    client_max_body_size 10m;

    # 本草小游记 H5 game (static build in /home/youdt/bencaoyou-web). Nakama console stays at /console/.
    root /home/youdt/bencaoyou-web;
    gzip on;
    gzip_types application/javascript text/javascript text/css application/json image/svg+xml;
    gzip_min_length 1024;
    location = / {
        include /etc/nginx/snippets/bencaoyou-security-headers.conf;
        try_files /index.html =404;
        add_header Cache-Control "no-cache";
    }
    location = /index.html {
        include /etc/nginx/snippets/bencaoyou-security-headers.conf;
        add_header Cache-Control "no-cache";
    }
    # A6-C3: the service worker script must always revalidate so a new deploy is picked up.
    location = /sw.js {
        include /etc/nginx/snippets/bencaoyou-security-headers.conf;
        add_header Cache-Control "no-cache";
        try_files $uri =404;
    }
    location ^~ /assets/ {
        include /etc/nginx/snippets/bencaoyou-security-headers.conf;
        expires 30d;
        add_header Cache-Control "public, max-age=2592000, immutable";
        try_files $uri =404;
    }
    location ^~ /fonts/ { expires 30d; include /etc/nginx/snippets/bencaoyou-security-headers.conf; try_files $uri =404; }
    location ^~ /share/ { expires 7d; try_files $uri =404; }
    location = /game-sharing.json { try_files $uri =404; }
    # Browser end-to-end test client (Nakama JS SDK).
    location ^~ /demo/ {
        alias /home/youdt/nakama-deploy/web/;
        index index.html;
    }

    # Embedded Nakama console API (served by the console listener on 7351).
    location ^~ /v2/console/ {
        proxy_pass http://127.0.0.1:7351;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 120s;
    }

    # Console UI and its absolute asset paths.
    location = /console {
        return 301 /console/;
    }

    location ^~ /console/ {
        proxy_pass http://127.0.0.1:7351;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location ^~ /static/ {
        proxy_pass http://127.0.0.1:7351;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
    }

    location = /favicon.ico {
        proxy_pass http://127.0.0.1:7351;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
    }

    # Nakama realtime socket.
    location ^~ /ws {
        proxy_pass http://127.0.0.1:7350;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
        proxy_buffering off;
    }

    # bencao-auth (127.0.0.1:7360): only the public endpoints; internal/deletion APIs are never exposed.
    location = /auth/sms/send {
        limit_req zone=bcy_sms burst=2 nodelay;
        proxy_pass http://127.0.0.1:7360;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For "";
        proxy_set_header X-Internal-Secret "";
        client_max_body_size 16k;
        add_header Cache-Control "no-store" always;
    }
    location = /auth/sms/verify {
        limit_req zone=bcy_auth burst=10 nodelay;
        proxy_pass http://127.0.0.1:7360;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For "";
        proxy_set_header X-Internal-Secret "";
        client_max_body_size 16k;
        add_header Cache-Control "no-store" always;
    }
    location = /auth/realname/submit {
        limit_req zone=bcy_auth burst=10 nodelay;
        proxy_pass http://127.0.0.1:7360;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For "";
        proxy_set_header X-Internal-Secret "";
        client_max_body_size 16k;
        add_header Cache-Control "no-store" always;
    }
    location = /auth/realname/status {
        limit_req zone=bcy_api burst=20 nodelay;
        proxy_pass http://127.0.0.1:7360;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For "";
        proxy_set_header X-Internal-Secret "";
        client_max_body_size 16k;
        add_header Cache-Control "no-store" always;
    }
    location = /auth/config {
        limit_req zone=bcy_api burst=20 nodelay;
        proxy_pass http://127.0.0.1:7360;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For "";
        proxy_set_header X-Internal-Secret "";
        client_max_body_size 16k;
        add_header Cache-Control "no-store" always;
    }
    location ^~ /auth/ { return 404; }
    location ^~ /internal/ { return 404; }
    # Compliance admin console (实名认证 / 未成年人保护 runtime config), served by bencao-auth.
    # Password login + HttpOnly/Secure/SameSite=Strict cookie; the app sets its own strict CSP and X-Frame-Options.
    location = /admin { return 301 /admin/; }
    location ^~ /admin/ {
        limit_req zone=bcy_auth burst=20 nodelay;
        proxy_pass http://127.0.0.1:7360;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For "";
        proxy_set_header X-Internal-Secret "";
        client_max_body_size 16k;
        add_header Cache-Control "no-store" always;
        add_header Strict-Transport-Security "max-age=31536000" always;
        add_header X-Robots-Tag "noindex, nofollow" always;
    }
    # Nakama HTTP API / gRPC-gateway (/v2/console/ above is longer and wins) and health.
    location ^~ /v2/account/authenticate/ {
        limit_req zone=bcy_auth burst=10 nodelay;
        proxy_pass http://127.0.0.1:7350;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
    location ^~ /v2/ {
        limit_req zone=bcy_api burst=60 nodelay;
        proxy_pass http://127.0.0.1:7350;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
    }
    location = /healthcheck {
        proxy_pass http://127.0.0.1:7350;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
    }
    # Anything else: SPA fallback to the game.
    location / {
        try_files $uri /index.html;
    }
}
