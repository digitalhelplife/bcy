# http{} context (installed to /etc/nginx/conf.d). Per-IP limits for the Nakama API and auth.
limit_req_zone $binary_remote_addr zone=bcy_api:10m rate=20r/s;
limit_req_zone $binary_remote_addr zone=bcy_auth:10m rate=30r/m;
limit_req_zone $binary_remote_addr zone=bcy_sms:10m rate=6r/m;
limit_req_status 429;
