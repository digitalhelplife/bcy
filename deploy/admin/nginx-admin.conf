# /etc/nginx/conf.d/bencao-admin.conf
# Place inside the bencaoyou.tryliang.me server block. Keep /admin/ IP-allowlisted in S0/S1.

location = /admin { return 301 /admin/; }

location ^~ /admin/api/ {
    allow 127.0.0.1;
    allow 203.0.113.10;   # operator/VPN egress — replace
    allow 203.0.113.11;
    deny all;

    proxy_pass http://127.0.0.1:7361;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_read_timeout 60s;
    client_max_body_size 4m;
}

location ^~ /admin/media/ {
    allow 127.0.0.1;
    allow 203.0.113.10;
    allow 203.0.113.11;
    deny all;
    proxy_pass http://127.0.0.1:7361;
    proxy_set_header X-Real-IP $remote_addr;
}

location ^~ /admin/ {
    allow 127.0.0.1;
    allow 203.0.113.10;
    allow 203.0.113.11;
    deny all;

    alias /opt/bencao/admin-dist/;
    try_files $uri $uri/ /admin/index.html;
    add_header Cache-Control "no-store";
    add_header X-Frame-Options "DENY" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "no-referrer" always;
    add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; connect-src 'self'; font-src 'self'; frame-ancestors 'none'; base-uri 'none'" always;
}

# The old bencao-auth single-page admin is retired after migration; keep this blocked.
location ^~ /auth/admin/ { return 404; }
